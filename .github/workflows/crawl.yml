name: crawl

# Runs the crawl on GitHub's machines instead of the laptop. The free tier
# gives 2000 minutes a month; a full pass over the shops costs ~30 of them.
on:
  schedule:
    - cron: "0 22 * * *"   # 05:00 Vietnam time daily (UTC+7)
  workflow_dispatch:
    inputs:
      limit:
        description: "Max product pages per listing"
        default: "60"
        required: false

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install "psycopg[binary]"

      - name: Check database connection
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not set - add the Neon connection string in Settings > Secrets and variables > Actions"
            exit 1
          fi
          python -c "from crawler.storage import Storage; \
                     s=Storage(); s.__enter__(); \
                     print('connected, rows before:', s.count()); s.__exit__()"

      - name: Crawl
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python main.py --limit ${{ inputs.limit || '60' }}

      - name: Summary
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          {
            echo "### Crawl finished"
            echo ""
            echo '```'
            python main.py --stats
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
